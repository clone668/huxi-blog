<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>超级鲁班尺</title>
    <style>
        /* 页面居中布局 */
        body {
            display: flex;
            flex-direction: column;  /* 改为纵向排列 */
            align-items: center;     /* 水平居中 */
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            background-color: #fafafa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 主容器样式 */
        .container {
            text-align: center;
            background-color: white;
            padding: 10px 25px;
            border-radius: 0;  /* 移除圆角 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;  /* 添加容器间距 */
            max-width: 600px;
            width: 90%;
            transition: all 0.3s ease;
        }
        .container:hover {
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        /* 输入框样式 */
        #measureInput {
            width: calc(100% - 30px);
            padding: 10px 15px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fafafa;
            margin-bottom: 20px;
        }
        #measureInput:focus {
            outline: none;
            border-color: #333;
            box-shadow: 0 0 0 3px rgba(51,51,51,0.1);
        }
        /* 尺子容器样式 */
        .ruler-container {
            width: 247.5px;
            height: 66px;
            border: 2px solid #e1e1e1;
            /* border-radius: 6px; */
            position: relative;
            cursor: grab;
            margin: 0 auto;
            background-color: #fafafa;
        }
        .ruler-container:active {
            cursor: grabbing;
        }
        /* 中心红线样式 */
        .vertical-line {
            position: absolute;
            left: 50%;
            height: 66px;
            width: 2px;
            background-color: #e74c3c;
            z-index: 3;
            pointer-events: none;
            transform: translateX(-50%);
        }
        
        /* 上方延伸线 */
        .vertical-line::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 0;
            width: 2px;
            height: 6px;
            background-color: #e74c3c;
        }
        
        /* 下方延伸线 */
        .vertical-line::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 2px;
            height: 6px;
            background-color: #e74c3c;
        }
        /* 文公尺图片样式 */
        .ruler-image {
            position: absolute;/* 绝对定位 */
            height: 39px;
            width: 3619.5px;
            user-select: none;
        }
        /* 丁兰尺图片样式 */
        .dinglan-image {
            position: absolute;
            top: 39px;
            height: 27px;
            width: 3201px;
            user-select: none;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;  /* 标签和输入框之间的间距 */
        }

        .input-group label {
            color: #333;
            font-size: 14px;
        }

        .input-label {
            color: #2c3e50;
            font-size: 15px;
            margin-bottom: 10px;
            font-weight: 500;
            text-align: left;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .button-group button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background-color: transparent;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            min-width: 60px;
            transition: all 0.3s ease;
        }

        .button-group button:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .button-group button:active {
            transform: translateY(1px);
        }
        /* 介绍文字样式 */
        .intro-text {
            text-align: left;
            line-height: 1.8;
            color: #333;
        }
        
        .intro-text h3 {
            font-size: 18px;
            margin: 0 0 15px 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        
        .intro-text p {
            margin: 0 0 12px 0;
            font-size: 15px;
        }
        
        .intro-text strong {
            color: #666;
        }
        .author-info {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .author-info2 {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            font-weight: bold;
        }
        .author-info p {
            margin: 5px 0;
        }
        /* 添加移动设备的样式 */
        .mobile-device {
            /* 字体放大样式 */
            font-size: 300% !important;
        }

        .mobile-device .button-group button {
            padding: 20px 40px !important;
            font-size: 36px !important;
            min-width: 150px !important;
        }

        .mobile-device .ruler-container {
            width: 495px !important;  /* 原247.5px * 2 */
            height: 132px !important; /* 原66px * 2 */
        }

        .mobile-device .vertical-line {
            height: 132px !important; /* 原66px * 2 */
            width: 4px !important;
        }

        .mobile-device .ruler-image {
            height: 78px !important;    /* 原39px * 2 */
            width: 7239px !important;   /* 原3619.5px * 2 */
        }

        .mobile-device .dinglan-image {
            top: 78px !important;       /* 原39px * 2 */
            height: 54px !important;    /* 原27px * 2 */
            width: 6402px !important;   /* 原3201px * 2 */
        }

        .mobile-device #measureInput {
            font-size: 42px !important;
            padding: 25px 35px !important;
        }

        .mobile-device .input-label {
            font-size: 40px !important;
        }

        /* 增大介绍文字的字体 */
        .mobile-device .intro-text h3 {
            font-size: 44px !important;
        }

        .mobile-device .intro-text p {
            font-size: 38px !important;
        }

        /* 增大作者信息字体 */
        .mobile-device .author-info {
            font-size: 36px !important;
        }

        .mobile-device .author-info2 {
            font-size: 46px !important;
        }

        /* 调整容器间距 */
        .mobile-device.container {
            margin-bottom: 40px !important;
            padding: 20px 35px !important;
        }

        /* 调整按钮组间距 */
        .mobile-device .button-group {
            gap: 24px !important;
            margin-top: 30px !important;
        }

        /* 调整移动设备下的输入框和容器样式 */
        .mobile-device {
            /* 确保容器有合适的内边距和宽度 */
            padding: 20px !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }

        .mobile-device #measureInput {
            font-size: 42px !important;
            padding: 25px 35px !important;
            width: 600px !important;        /* 限制输入框 */
            max-width: 100% !important;     /* 确保不会溢出 */
            box-sizing: border-box !important;
        }

        .mobile-device .input-group {
            display: flex !important;
            flex-direction: column !important;  /* 改为垂直布局 */
            align-items: center !important;     /* 居中对齐 */
            gap: 20px !important;              /* 元素间距 */
            margin-bottom: 30px !important;
        }

        .mobile-device .input-label {
            font-size: 40px !important;
            text-align: left !important;
            display: block !important;
            margin-bottom: 10px !important;
        }

        /* 调整按钮组样式 */
        .mobile-device .button-group {
            display: flex !important;
            flex-wrap: wrap !important;         /* 允许按钮换行 */
            justify-content: center !important;
            gap: 24px !important;
            margin-top: 30px !important;
            width: 100% !important;
        }

        .mobile-device .button-group button {
            margin: 5px !important;
        }

        /* 引导提示样式 */
        .swipe-guide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 1000;
        }

        .guide-content {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            top: 50%;
            margin-top: -27px;
        }

        .guide-content img {
            width: 150px;
            /* margin: 10px 0; */
        }

        .guide-content p {
            color: white;
            margin: 15px 0;
        }

        .guide-content button {
            padding: 8px 20px;
            margin-top: 15px;
            border: none;
            background: #2196F3;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 移动设备样式调整 */
        .mobile-device .guide-content img {
            margin-top: 50px;
            width: 300px !important;
        }

        .mobile-device .guide-content p {
            font-size: 36px !important;
        }

        .mobile-device .guide-content button {
            padding: 30px 60px !important;
            font-size: 42px !important;
            border-radius: 8px !important;
        }

        /* 移动设备下的位置调整 */
        /* .mobile-device .guide-content {
            margin-top: -54px !important;
        } */
    </style>
</head>
<body>
    <div class="swipe-guide">
        <div class="guide-content">
            <img src="hand-swipe.gif" alt="滑动示意">
            <p>尺子可以左右滑动调节</p>
            <button id="gotIt">我知道了</button>
        </div>
    </div>
    <!-- 删除或注释掉这个提示框 -->
    <!--
    <div id="mobileAlert" style="display: none;" class="container">
        <div style="color: #e74c3c; padding: 10px;">
            建议使用电脑访问以获得更好的体验
        </div>
    </div>
    -->
    <div class="container">
        <div class="author-info2">
            超级鲁班尺
        </div>
    </div>
    <!-- 介绍容器 -->
    <div class="container">
        <div class="intro-text">
            <h3>鲁班尺介绍:</h3>
            <p><strong>上为门公尺(阳宅)：</strong><br>
            <span style="padding-left: 2em">又称鲁班尺(文公尺) ，相传为春秋时鲁国的公输班创立的。主要用作阳居之门房、架樑、叠瓦等建筑用途。</span></p>
            <p><strong>下为丁兰尺(阴宅)：</strong><br>
            <span style="padding-left: 2em">主要用途为建造阴居坟墓、阳宅之神位、公妈桌位。</span></p>
        </div>
    </div>

    <!-- 主操作容器 -->
    <div class="container">
        <div class="input-label">输入框（毫米）：</div>
        <input type="number" id="measureInput" placeholder="请输入尺寸(mm)" step="0.1">
        <div style="position: relative;">
            <div class="vertical-line"></div>
            <div class="ruler-container" style="overflow: hidden;">
                <img src="wg.png" class="ruler-image" id="wengong" style="left: -51px">
                <img src="dl.png" class="dinglan-image" id="dinglan" style="left: -14px">
            </div>
        </div>
        <div class="button-group">
            <button id="minus20">-20</button>
            <button id="minus5">-5</button>
            <button id="plus5">+5</button>
            <button id="plus20">+20</button>
        </div>
    </div>

    <!-- 作者信息容器 -->
    <div class="container">
        <div class="author-info">
            <p>© 2024 Clone . All rights reserved.</p>
            <p>clone-ai@QQ.com</p>
        </div>
    </div>

    <script>
        // 全局变量声明
        let isDragging = false;
        let startX = 0;
        const rulerContainer = document.querySelector('.ruler-container');
        const measureInput = document.querySelector('#measureInput');
        const wengongImg = document.querySelector('.ruler-image');
        const dinglanImg = document.querySelector('.dinglan-image');

        /**
         * 计算文公尺位置
         * @param {number} mm - 输入的毫米数
         * @returns {number} - 计算后的像素位置
         */
        function calculateWengong(mm) {
            if (mm > 429) {
                mm = mm - Math.floor(mm / 429) * 429;
            }
            const multiplier = isMobileDevice() ? 15 : 7.5; // 移动设备用15，桌面用7.5
            const offset = isMobileDevice() ? 153 : 76.5;   // 移动设备偏移量加倍
            return -(mm * multiplier + offset);
        }

        /**
         * 计算丁兰尺位置
         * @param {number} mm - 输入的毫米数
         * @returns {number} - 计算后的像素位置
         */
        function calculateDinglan(mm) {
            if (mm > 388) {
                mm = mm - Math.floor(mm / 388) * 388;
            }
            const multiplier = isMobileDevice() ? 15 : 7.5; // 移动设备用15，桌面用7.5
            const offset = isMobileDevice() ? 42 : 21;      // 移动设备偏移量加倍
            return -(mm * multiplier + offset);
        }

        // 鼠标事件处理
        function handleMouseDown(e) {
            isDragging = true;
            startX = e.clientX;
            e.preventDefault();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const multiplier = isMobileDevice() ? 15 : 7.5;
            const mmChange = Math.floor(dx / multiplier);
            
            updateRulerPosition(mmChange);
            startX = e.clientX;
        }

        function handleMouseUp() {
            isDragging = false;
        }

        // 触摸事件处理
        function handleTouchStart(e) {
            isDragging = true;
            startX = e.touches[0].clientX;
            e.preventDefault();
        }

        function handleTouchMove(e) {
            if (!isDragging) return;
            
            const dx = e.touches[0].clientX - startX;
            const multiplier = isMobileDevice() ? 15 : 7.5;
            const mmChange = Math.floor(dx / multiplier);
            
            updateRulerPosition(mmChange);
            startX = e.touches[0].clientX;
            e.preventDefault();
        }

        // 通用更新位置函数
        function updateRulerPosition(mmChange) {
            let currentValue = parseFloat(measureInput.value) || 0;
            let newValue = currentValue - mmChange;
            
            if (newValue < 0) {
                newValue = 0;
            }
            
            measureInput.value = newValue.toFixed(1);
            wengongImg.style.left = calculateWengong(newValue) + 'px';
            dinglanImg.style.left = calculateDinglan(newValue) + 'px';
        }

        // 分别绑定鼠标和触摸事件
        if (isMobileDevice()) {
            // 移动设备使用触摸事件
            rulerContainer.addEventListener('touchstart', handleTouchStart);
            rulerContainer.addEventListener('touchmove', handleTouchMove);
            rulerContainer.addEventListener('touchend', handleMouseUp);
        } else {
            // 桌面设备使用鼠标事件
            rulerContainer.addEventListener('mousedown', handleMouseDown);
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        // 按钮点击事件处理
        document.getElementById('plus20').onclick = () => {
            let currentValue = parseFloat(measureInput.value) || 0;
            measureInput.value = (currentValue + 20).toFixed(1);
            wengongImg.style.left = calculateWengong(currentValue + 20) + 'px';
            dinglanImg.style.left = calculateDinglan(currentValue + 20) + 'px';
        };

        document.getElementById('plus5').onclick = () => {
            let currentValue = parseFloat(measureInput.value) || 0;
            measureInput.value = (currentValue + 5).toFixed(1);
            wengongImg.style.left = calculateWengong(currentValue + 5) + 'px';
            dinglanImg.style.left = calculateDinglan(currentValue + 5) + 'px';
        };

        document.getElementById('minus5').onclick = () => {
            let currentValue = parseFloat(measureInput.value) || 0;
            let newValue = currentValue - 5;
            if (newValue < 0) newValue = 0;
            measureInput.value = newValue.toFixed(1);
            wengongImg.style.left = calculateWengong(newValue) + 'px';
            dinglanImg.style.left = calculateDinglan(newValue) + 'px';
        };

        document.getElementById('minus20').onclick = () => {
            let currentValue = parseFloat(measureInput.value) || 0;
            let newValue = currentValue - 20;
            if (newValue < 0) newValue = 0;
            measureInput.value = newValue.toFixed(1);
            wengongImg.style.left = calculateWengong(newValue) + 'px';
            dinglanImg.style.left = calculateDinglan(newValue) + 'px';
        };

        // 添加设备检测函数
        function isMobileDevice() {
            return (typeof window.orientation !== "undefined") 
                || (navigator.userAgent.indexOf('IEMobile') !== -1)
                || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // 页面加载时检测设备并应用相应样式
        window.addEventListener('load', function() {
            if (isMobileDevice()) {
                // 给所有容器添加移动设备类
                document.querySelectorAll('.container').forEach(container => {
                    container.classList.add('mobile-device');
                });
                // 给引导提示也添加移动设备类
                document.querySelector('.swipe-guide').classList.add('mobile-device');
            }
            
            const hasSeenGuide = localStorage.getItem('hasSeenSwipeGuide');
            const swipeGuide = document.querySelector('.swipe-guide');
            
            if (!hasSeenGuide) {
                swipeGuide.style.display = 'flex';
                
                // 获取丁兰尺的位置
                const dinglanElement = document.getElementById('dinglan');
                const dinglanRect = dinglanElement.getBoundingClientRect();
                const guideContent = document.querySelector('.guide-content');
                
                // 设置引导内容的位置
                guideContent.style.top = dinglanRect.top + 'px';
            }

            document.getElementById('gotIt').addEventListener('click', function() {
                swipeGuide.style.display = 'none';
                localStorage.setItem('hasSeenSwipeGuide', 'true');
            });
        });

        // 添加输入框值变化的事件监听器
        measureInput.addEventListener('input', function() {
            let value = parseFloat(this.value) || 0;
            if (value < 0) value = 0;
            wengongImg.style.left = calculateWengong(value) + 'px';
            dinglanImg.style.left = calculateDinglan(value) + 'px';
        });

        // 1. 缓存 DOM 元素
        const elements = {
            rulerContainer: document.querySelector('.ruler-container'),
            measureInput: document.querySelector('#measureInput'),
            wengongImg: document.querySelector('.ruler-image'),
            dinglanImg: document.querySelector('.dinglan-image'),
            containers: document.querySelectorAll('.container'),
            swipeGuide: document.querySelector('.swipe-guide')
        };

        // 2. 添加节流函数优化拖动性能
        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }

        // 3. 优化 handleMouseMove
        function handleMouseMove(e) {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const multiplier = isMobileDevice() ? 15 : 7.5;
            const mmChange = Math.floor(dx / multiplier);
            
            updateRulerPosition(mmChange);
            startX = e.clientX;
        }

        // 使用节流优化后的 handleMouseMove
        const throttledMouseMove = throttle(handleMouseMove, 16);

        // 4. 优化设备检测
        function isMobileDevice() {
            return (window.matchMedia("(max-width: 768px)").matches ||
                    /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
        }

        // 5. 优化数值验证
        function validateInput(value) {
            value = parseFloat(value);
            return isNaN(value) ? 0 : Math.max(0, value);
        }

        // 6. 更新事件监听器绑定
        if (isMobileDevice()) {
            rulerContainer.addEventListener('touchstart', handleTouchStart);
            rulerContainer.addEventListener('touchmove', throttle(handleTouchMove, 16));
            rulerContainer.addEventListener('touchend', handleMouseUp);
        } else {
            rulerContainer.addEventListener('mousedown', handleMouseDown);
            document.addEventListener('mousemove', throttledMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        // 7. 优化按钮点击处理
        const buttonHandlers = {
            'plus20': 20,
            'plus5': 5,
            'minus5': -5,
            'minus20': -20
        };

        Object.entries(buttonHandlers).forEach(([id, change]) => {
            document.getElementById(id).onclick = () => {
                let currentValue = validateInput(measureInput.value);
                let newValue = Math.max(0, currentValue + change);
                measureInput.value = newValue.toFixed(1);
                wengongImg.style.left = calculateWengong(newValue) + 'px';
                dinglanImg.style.left = calculateDinglan(newValue) + 'px';
            };
        });

        // 8. 优化输入框处理
        measureInput.addEventListener('input', function() {
            let value = validateInput(this.value);
            wengongImg.style.left = calculateWengong(value) + 'px';
            dinglanImg.style.left = calculateDinglan(value) + 'px';
        });
    </script>
</body>
</html>
